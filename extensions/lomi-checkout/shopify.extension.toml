api_version = "2024-04"

[[extensions]]
type = "ui_extension"
name = "lomi. Checkout"
handle = "lomi-checkout"

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
  module = "./src/Checkout.tsx"

  [extensions.capabilities]
  network_access = true
  block_progress = false # We do not need to block progress, just offer an alternative payment button
