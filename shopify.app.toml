# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9b77c560341e051a079adff2f33ba2e2"
application_url = "https://shopify.lomi.africa"
embedded = true
name = "lomi."
handle = "lomi-app"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_orders,write_orders,read_checkouts,write_checkouts"

[auth]
redirect_urls = [
  "https://shopify.lomi.africa/auth/callback",
  "https://shopify.lomi.africa/auth/shopify/callback",
  "https://shopify.lomi.africa/api/auth/callback",
  "https://shopify.lomi.africa/auth/exit-iframe"
]

[pos]
embedded = true

[app_proxy]
url = "https://shopify.lomi.africa/api"
subpath = "lomi"
prefix = "apps"
